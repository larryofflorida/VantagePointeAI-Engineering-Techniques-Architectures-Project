name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, smoke and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: make install

      - name: Build (markdown → chunks → assistant page)
        run: make build

      - name: Verify generated files are up to date
        run: make check-generated

      - name: Import and page-script check
        run: make import-check

      - name: MCP smoke test (tool discovery + tool calls)
        run: make smoke-mcp

      - name: Unit, start-up, MCP and evaluation-gate tests
        run: make test

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            evaluation/results.json
            evaluation/demo_results.json
            evaluation/study_results.json
          if-no-files-found: warn

  pdf-reproducibility:
    name: PDF conversion reproducibility (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make install
      - name: Re-run PDF → markdown and compare with committed files
        run: |
          make convert
          git diff --exit-code -- markdown || (echo "::warning::PDF extraction differs from committed markdown (library version drift?). Run 'make convert build' and commit if intended." && exit 1)

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke test
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "${{ steps.deployment.outputs.page_url }}" | grep -q "VantagePoint HR Assistant"
          echo "Deployed page responded and contains the app title"
