ification & Acceptable Use Policy > 5. Phishing, Removable Media & Network Security > 5.2 USB & Removable Media","text":"USB flash drives, external hard drives, and SD cards are blocked by default via CrowdStrike Falcon Device Control. Temporary read/write exceptions for engineering hardware testing require a security ticket approved by the CISO's office."},{"id":"POL-SEC-001-5.3-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"5.3","heading":"5.3 Security Incident Reporting SLA","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 5. Phishing, Removable Media & Network Security > 5.3 Security Incident Reporting SLA","text":"If you suspect a phishing email, credential compromise, accidental data exposure, or malware infection, report it immediately using the 'Report Phish' button in Gmail or by messaging #security-incidents (or calling +1-800-555-0199) within 30 minutes. VantagePoint maintains a blameless reporting culture—employees who promptly report honest mistakes will not face disciplinary action."},{"id":"POL-SEC-001-6.1-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"6.1","heading":"6.1 Training & Phishing Simulations","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 6. Security Awareness Training & Data Retention > 6.1 Training & Phishing Simulations","text":"All employees must complete annual Security Awareness & Privacy Training within 30 days of assignment. InfoSec conducts monthly unannounced phishing simulations. Employees who click a simulated phishing link must complete a 10-minute micro-training module; three consecutive simulation failures within a 6-month window trigger mandatory coaching with InfoSec and the employee's manager."},{"id":"POL-SEC-001-6.2-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"6.2","heading":"6.2 Data Retention & Secure Disposal","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 6. Security Awareness Training & Data Retention > 6.2 Data Retention & Secure Disposal","text":"Slack direct messages and private channels retain messages for 365 days unless placed on Legal Hold. Customer production snapshots in staging environments are prohibited; anonymized synthetic datasets must be used for QA testing."}];

  if(!sample){box.innerHTML=hits.length?"<p>Most relevant passages:</p>"+hits.slice(0,3).map(x=>`<div class="hit"><h4>${esc(x.c.breadcrumb)}</h4>${md(x.c.text)}</div>`).join(""):"I couldn’t find a matching policy passage. Please contact People Operations.";return}
  const ex=hits.map(x=>`[[${x.c.policy_id} §${x.c.section}]] ${x.c.breadcrumb}\n${x.c.text}`).join("\n\n---\n\n");
  const msg=`${RULES}\n\nEMPLOYEE RECORD (signed-in user):\n${JSON.stringify(ctx(cur))}\n\nPOLICY EXCERPTS (each starts with its citation label):\n${ex}\n\nQUESTION: ${q}`;
  const r=await sample([...hist,{role:"user",content:msg}],{cache:false,onText:({text})=>{box.innerHTML=md(text)}});
  hist.push({role:"user",content:q},{role:"assistant",content:r.text});if(hist.length>8)hist=hist.slice(-8);renderAnswer(box,r.text,hits);
 }catch(e){box.innerHTML="Sorry, I couldn’t generate an answer"+(e&&e.code==="rate_limited"?" (rate limited, try again shortly)":e&&e.code==="not_granted"?" (permission not granted)":"")+". Showing the best passages instead:"+hits.slice(0,3).map(x=>`<div class="hit"><h4>${esc(x.c.breadcrumb)}</h4>${md(x.c.text)}</div>`).join("")}
 finally{busy=false;$("go").disabled=false}}
$("go").onclick=ask;$("q").onkeydown=e=>{if(e.key==="Enter")ask()};
/* ---------- library ---------- */
function lib(){const q=$("ls").value.trim();const r=q?search(q,12).map(x=>x.c):CHUNKS;$("lr").innerHTML=r.slice(0,40).map(c=>`<div class="hit"><h4>${esc(c.breadcrumb)} <small style="color:var(--mut)">· v${esc(c.version)} · effective ${esc(c.effective)}</small></h4><div>${md(c.text)}</div></div>`).join("")||"No matches."}
$("ls").oninput=lib;lib();profile();greet();
</script></body></html>
