<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VantagePoint HR Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#e3e6eb;--acc:#1f5eff;--accbg:#e9efff;--warn:#b45309;--warnbg:#fff4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--card:#171d26;--ink:#e8ecf2;--mut:#98a2b3;--line:#283040;--acc:#7aa2ff;--accbg:#1c2740;--warn:#f5b45a;--warnbg:#2a2216}}
:root[data-theme="dark"]{--bg:#0f1319;--card:#171d26;--ink:#e8ecf2;--mut:#98a2b3;--line:#283040;--acc:#7aa2ff;--accbg:#1c2740;--warn:#f5b45a;--warnbg:#2a2216}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}header small{color:var(--mut)}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 20px;max-width:1180px;margin:auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
select,input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.who h2{font-size:16px;margin:10px 0 0}.who p{margin:2px 0;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px}.stat b{display:block;font-size:18px}.stat span{font-size:11.5px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{padding:7px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#log{display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:58vh;overflow-y:auto;padding:4px}
.m{max-width:92%;padding:10px 13px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--acc);color:#fff}.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.m p{margin:0 0 8px}.m ul{margin:4px 0 8px;padding-left:20px}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:12px;background:var(--accbg);color:var(--acc);font-size:12px;cursor:pointer;border:0;font-family:inherit}
.src{margin-top:8px;font-size:12.5px;color:var(--mut)}
.pop{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.pop h4{margin:0 0 6px;font-size:13px}
.scroll{overflow-x:auto}table{border-collapse:collapse;font-size:12.5px;margin:6px 0}th,td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.row{display:flex;gap:8px;margin-top:10px}.row button{padding:9px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
.row button:disabled{opacity:.5}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ex button{padding:5px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;cursor:pointer;font-size:13px;font-family:inherit}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
details{margin-top:6px;font-size:12.5px;color:var(--mut)}
.hit{border-top:1px solid var(--line);padding:10px 0}.hit h4{margin:0 0 4px;font-size:13.5px}.hit .t{font-size:13px;white-space:pre-wrap}
</style></head><body>
<header><h1>🧭 VantagePoint HR Assistant</h1><small>Prototype · synthetic data · snapshot <span id="snap"></span></small></header>
<div class="wrap">
 <aside class="card who">
  <label for="emp"><b>Signed in as</b></label>
  <select id="emp"></select>
  <div id="prof"></div>
  <div class="note">Demo only. The assistant sees just the selected employee’s record plus the policy library. Verify important decisions with People Operations.</div>
 </aside>
 <main>
  <div class="tabs"><button id="t1" class="on">Assistant</button><button id="t2">Policy library</button></div>
  <section id="p1" class="card">
   <div id="log"></div>
   <div class="ex" id="ex"></div>
   <div class="row"><input type="text" id="q" placeholder="Ask about PTO, benefits, travel, remote work…" autocomplete="off"><button id="go">Ask</button></div>
   <div id="mode" class="src"></div>
  </section>
  <section id="p2" class="card" hidden>
   <input type="text" id="ls" placeholder="Search all 73 policy passages…">
   <div id="lr"></div>
  </section>
 </main>
</div>
<script>
const CHUNKS=[{"id":"POL-BEN-001-1-1","policy_id":"POL-BEN-001","policy_title":"Health, Welfare, Retirement (401k) & Wellness Benefits Guide","version":"2026.1","effective":"January 1, 2026","section":"1","heading":"1. Benefit Eligibility & Enrollment Windows","breadcrumb":"POL-BEN-001 Health, Welfare, Retirement (401k) & Wellness Benefits Guide > 1. Benefit Eligibility & Enrollment Windows","text":"Regular full-time employees scheduled to work 30 or more hours per week are eligible for VantagePoint's comprehensive Total Rewards program. Coverage begins on the first day of the month coinciding with or immediately following the employee's hire date (e.g., an employee starting March 10 becomes covered April 1; an employee starting April 1 is covered April 1).\n\n- New Hire Enrollment Window: Employees have strictly 30 calendar days from their hire date to submit elections in Rippling Benefits. Missing this window defaults the employee to waived coverage until the next Open Enrollment.\n- Eligible Dependents: Legal spouse, registered domestic partner, and dependent children (biological, adopted, stepchildren, or legal guardianship) up to age 26.\n- Qualifying Life Events (QLE): Mid-year benefit changes are permitted only within 30 calendar days of a documented IRS Qualifying Life Event (marriage, birth/adoption, divorce, or loss of other group coverage)."},{"id":"POL-BEN-001-2-1","policy_id":"POL-BEN-001","policy_title":"Health, Welfare, Retirement (401k) & Wellness Benefits Guide","version":"2026.1","effective":"January 1, 2026","section":"2","heading":"2. Medical, Dental & Vision Plans (2026 Plan Year)","breadcrumb":"POL-BEN-001 Health, Welfare, Retirement (401k) & Wellness Benefits Guide > 2. Medical, Dental & Vision Plans (2026 Plan Year)","text":"VantagePoint subsidizes 90% of employee-only premiums and 75% of dependent premiums across three medical plan options administered by Aetna (or Kaiser Permanente HMO in California and Washington):\n\n| Plan Feature | Aetna HDHP + HSA | Aetna PPO Core | Aetna PPO Premier |\n|---|---|---|---|\n| Annual Deductible (Ind / Fam) | $1,650 / $3,300 | $750 / $1,500 | $250 / $500 |\n| Out-of-Pocket Max (Ind / Fam) | $4,000 / $8,000 | $3,000 / $6,000 | $2,000 / $4,000 |\n| Preventive Care | 100% Covered ($0) | 100% Covered ($0) | 100% Covered ($0) |\n| Primary Care / Specialist Copay | 10% after deductible | $25 PCP / $45 Specialist | $15 PCP / $30 Specialist |\n| Biweekly Employee Contribution (EE Only) | $32.00 / paycheck | $68.00 / paycheck | $115.00 / paycheck |\n| Company HSA Seed Contribution | $1,000 Ind / $2,000 Fam (deposited Jan & Jul) | Not Eligible (FSA Eligible) | Not Eligible (FSA Eligible) |\n\n- Dental & Vision: Delta Dental PPO (covers 100% preventive, 80% basic, 50% major up to $2,500/yr; $2,000 lifetime orthodontia) and VSP Vision Plus ($0 exam, $250 frame/contact lens allowance annually). VantagePoint pays 100% of employee-only dental and vision premiums."},{"id":"POL-BEN-001-3-1","policy_id":"POL-BEN-001","policy_title":"Health, Welfare, Retirement (401k) & Wellness Benefits Guide","version":"2026.1","effective":"January 1, 2026","section":"3","heading":"3. 401(k) Retirement Savings Plan","breadcrumb":"POL-BEN-001 Health, Welfare, Retirement (401k) & Wellness Benefits Guide > 3. 401(k) Retirement Savings Plan","text":"VantagePoint sponsors a tax-advantaged 401(k) plan administered by Fidelity Investments featuring Traditional pre-tax, Roth after-tax, and Mega Backdoor Roth in-plan conversion options (up to the 2026 IRS IRC §415(c) total additions limit).\n\n- Automatic Enrollment: New hires are automatically enrolled at a 6% pre-tax contribution rate after 30 days unless they opt out or adjust their deferral percentage in Fidelity NetBenefits.\n- Employer Match: VantagePoint matches 100% of employee contributions up to 4% of eligible compensation, plus 50% on the next 2% (a maximum 5% company match when the employee contributes 6% or more). Matching contributions are deposited per pay period with no year-end 'last day' requirement.\n- Vesting Schedule: Employee contributions are 100% vested immediately. Employer matching contributions vest on a 2-year schedule: 50% vested after 1 year of service and 100% vested after 2 years of service."},{"id":"POL-BEN-001-4-1","policy_id":"POL-BEN-001","policy_title":"Health, Welfare, Retirement (401k) & Wellness Benefits Guide","version":"2026.1","effective":"January 1, 2026","section":"4","heading":"4. Life, Disability & Family Building Benefits","breadcrumb":"POL-BEN-001 Health, Welfare, Retirement (401k) & Wellness Benefits Guide > 4. Life, Disability & Family Building Benefits","text":"- Basic Life & AD&D; Insurance: Company-paid coverage equal to 2x annual base salary (up to $500,000 maximum), with optional supplemental coverage available for purchase.\n- Short-Term & Long-Term Disability: 100% company-paid STD (see POL-HR-004) and LTD providing 60% of monthly pre-disability earnings up to $15,000/month after a 90-day elimination period.\n- Carrot Fertility & Adoption Assistance: Up to $20,000 lifetime reimbursement for IVF, egg/sperm freezing, surrogacy, or adoption agency and legal fees (see also POL-HR-004 for Parental Leave)."},{"id":"POL-BEN-001-5-1","policy_id":"POL-BEN-001","policy_title":"Health, Welfare, Retirement (401k) & Wellness Benefits Guide","version":"2026.1","effective":"January 1, 2026","section":"5","heading":"5. Wellness, Mental Health, Commuter & Learning Stipends","breadcrumb":"POL-BEN-001 Health, Welfare, Retirement (401k) & Wellness Benefits Guide > 5. Wellness, Mental Health, Commuter & Learning Stipends","text":"- Modern Health Mental Wellness: 12 free 1-on-1 therapy sessions and 12 free coaching sessions per calendar year for employees and their dependents, plus 24/7 crisis support.\n- Quarterly Wellness & Fitness Reimbursement ($150/quarter): Up to $600/year reimbursed via Forma for gym memberships, fitness classes, ergonomic footwear, meditation apps, or massage therapy. Quarterly balances expire at the end of each calendar quarter.\n- Annual Learning & Development Budget ($1,500/year): Reimbursable via Expensify (with manager approval) for job-related conferences, certifications, courses, and technical books. Unused funds do not roll over to the next calendar year.\n- Commuter Benefits: Pre-tax payroll deductions up to the 2026 IRS statutory limit ($325/month) for mass transit and qualified parking, plus a $75/month company transit subsidy for Miami, Austin, and Seattle hub employees."},{"id":"POL-COMP-001-1-1","policy_id":"POL-COMP-001","policy_title":"Compensation, Payroll Schedule, Overtime & Performance Review Policy","version":"3.0","effective":"January 1, 2026","section":"1","heading":"1. Pay Schedule & Timekeeping","breadcrumb":"POL-COMP-001 Compensation, Payroll Schedule, Overtime & Performance Review Policy > 1. Pay Schedule & Timekeeping","text":"VantagePoint pays all U.S. employees on a biweekly payroll cycle (26 pay periods per year), with direct deposits issued every other Friday. When a scheduled payday falls on a bank or Company holiday (POL-HR-002), direct deposit is issued on the preceding business day.\n\n- Pay Stubs & Tax Documents: Electronic pay statements and annual Forms W-2 are accessible via Workday Pay. Payroll inquiries or direct deposit updates must be submitted at least 5 business days before payday.\n- Non-Exempt Timekeeping: Non-exempt (hourly) employees must accurately record all hours worked, including meal breaks, daily in Workday Time Tracking. Working 'off the clock' is strictly prohibited."},{"id":"POL-COMP-001-2-1","policy_id":"POL-COMP-001","policy_title":"Compensation, Payroll Schedule, Overtime & Performance Review Policy","version":"3.0","effective":"January 1, 2026","section":"2","heading":"2. Overtime & Meal/Rest Break Compliance","breadcrumb":"POL-COMP-001 Compensation, Payroll Schedule, Overtime & Performance Review Policy > 2. Overtime & Meal/Rest Break Compliance","text":"Non-exempt employees must obtain written manager approval prior to working overtime. Regardless of pre-approval, all recorded overtime hours will be paid in full (unauthorized overtime may be addressed through coaching under POL-ETH-001).\n\n- Federal Overtime Standard: Non-exempt employees receive 1.5x their regular rate of pay for all hours worked in excess of 40 hours in a standard Sunday–Saturday workweek.\n- California & State-Specific Daily Overtime: Non-exempt employees working in California receive 1.5x pay for hours worked over 8 in a workday (up to 12 hours) and 2.0x double-time for hours over 12 in a workday or over 8 hours on the 7th consecutive workday.\n- Meal & Rest Periods: Non-exempt employees working more than 5 hours in a shift must take an uninterrupted, duty-free unpaid meal break of at least 30 minutes before the end of the 5th hour, plus a paid 15-minute rest break for every 4 hours worked."},{"id":"POL-COMP-001-3-1","policy_id":"POL-COMP-001","policy_title":"Compensation, Payroll Schedule, Overtime & Performance Review Policy","version":"3.0","effective":"January 1, 2026","section":"3","heading":"3. Performance Review & Merit Compensation Cycles","breadcrumb":"POL-COMP-001 Compensation, Payroll Schedule, Overtime & Performance Review Policy > 3. Performance Review & Merit Compensation Cycles","text":"VantagePoint conducts biannual performance calibrations in Lattice to ensure fair, transparent career progression and merit rewards:\n\n| Review Cycle | Evaluation Window | Calibration & Delivery | Compensation Impact |\n|---|---|---|---|\n| Mid-Year Check-In | June 1 – June 30 | Manager & peer 360 feedback delivered by July 15 | Mid-year promotions (for high-impact readiness) effective August 1 |\n| Annual Performance & Merit Review | December 1 – January 15 | Calibrated ratings delivered by February 10 | Annual merit base salary increases, equity refreshers, and annual bonus payouts effective March 1 |"},{"id":"POL-COMP-001-4.1-1","policy_id":"POL-COMP-001","policy_title":"Compensation, Payroll Schedule, Overtime & Performance Review Policy","version":"3.0","effective":"January 1, 2026","section":"4.1","heading":"4.1 Annual Corporate Performance Bonus","breadcrumb":"POL-COMP-001 Compensation, Payroll Schedule, Overtime & Performance Review Policy > 4. Annual Corporate Bonus & Employee Referral Program > 4.1 Annual Corporate Performance Bonus","text":"Regular full-time employees not on a sales commission plan participate in the Annual Corporate Bonus Plan with target bonus percentages ranging from 10% (L1–L4) to 20% (Directors+). Payouts are weighted 60% on Company ARR/EBITDA attainment and 40% on individual performance rating. Employees hired after October 1 are ineligible for that calendar year's bonus; hires between January 1 and September 30 receive a prorated payout."},{"id":"POL-COMP-001-4.2-1","policy_id":"POL-COMP-001","policy_title":"Compensation, Payroll Schedule, Overtime & Performance Review Policy","version":"3.0","effective":"January 1, 2026","section":"4.2","heading":"4.2 Employee Referral Bonus Program","breadcrumb":"POL-COMP-001 Compensation, Payroll Schedule, Overtime & Performance Review Policy > 4. Annual Corporate Bonus & Employee Referral Program > 4.2 Employee Referral Bonus Program","text":"Employees who refer a candidate hired into a regular full-time role receive a referral bonus paid out after the referred hire completes 90 days of continuous employment:\n\n- Standard Roles (L1–L4): $3,000 gross referral bonus.\n- Senior Technical, Product & Leadership Roles (L5+): $5,000 gross referral bonus.\n\nHiring managers, People Operations, Talent Acquisition, and VP+ executives are ineligible for referral bonuses for hires within their own reporting chain."},{"id":"POL-ETH-001-1-1","policy_id":"POL-ETH-001","policy_title":"Code of Workplace Conduct, Anti-Harassment & Progressive Discipline","version":"4.5","effective":"January 1, 2026","section":"1","heading":"1. Equal Employment Opportunity & Respectful Workplace","breadcrumb":"POL-ETH-001 Code of Workplace Conduct, Anti-Harassment & Progressive Discipline > 1. Equal Employment Opportunity & Respectful Workplace","text":"VantagePoint Technologies Inc. is an equal opportunity employer committed to fostering an inclusive, respectful, and psychologically safe environment. We strictly prohibit discrimination, harassment, or retaliation based on race, color, religion, sex (including pregnancy, childbirth, sexual orientation, and gender identity), national origin, age (40+), disability, genetic information, veteran status, or any other characteristic protected by federal, state, or local law.\n\nThis policy applies across all physical offices, remote workspaces, Slack channels, Zoom calls, company-sponsored social events, offsites, and client engagements."},{"id":"POL-ETH-001-2-1","policy_id":"POL-ETH-001","policy_title":"Code of Workplace Conduct, Anti-Harassment & Progressive Discipline","version":"4.5","effective":"January 1, 2026","section":"2","heading":"2. Anti-Harassment & Non-Retaliation","breadcrumb":"POL-ETH-001 Code of Workplace Conduct, Anti-Harassment & Progressive Discipline > 2. Anti-Harassment & Non-Retaliation","text":"- Unlawful Harassment: Includes unwelcome verbal, visual, or physical conduct—such as slurs, offensive jokes, derogatory memes in Slack, unwanted sexual advances, quid pro quo requests, or displaying explicit imagery—that creates an intimidating, hostile, or offensive work environment.\n- Reporting Channels: Employees who experience or witness misconduct should report it promptly to any People Partner, the Chief Legal Officer, or anonymously 24/7 via the EthicsPoint Hotline (ethics.vantagepoint.example.com or +1-888-555-0144).\n- Zero Tolerance for Retaliation: VantagePoint strictly prohibits retaliation against any individual who reports a concern in good faith or participates in an internal investigation. Retaliation is an independent violation subject to termination."},{"id":"POL-ETH-001-3.1-1","policy_id":"POL-ETH-001","policy_title":"Code of Workplace Conduct, Anti-Harassment & Progressive Discipline","version":"4.5","effective":"January 1, 2026","section":"3.1","heading":"3.1 Outside Employment ('Moonlighting')","breadcrumb":"POL-ETH-001 Code of Workplace Conduct, Anti-Harassment & Progressive Discipline > 3. Conflicts of Interest, Outside Employment & Gifts > 3.1 Outside Employment ('Moonlighting')","text":"Full-time employees may engage in outside consulting, teaching, or board service only if it: (a) occurs strictly outside working hours without using company equipment or IP, (b) does not involve a competitor, customer, or vendor of VantagePoint, and (c) is disclosed in writing and approved in advance by Legal Compliance via the Conflict of Interest Disclosure Form."},{"id":"POL-ETH-001-3.2-1","policy_id":"POL-ETH-001","policy_title":"Code of Workplace Conduct, Anti-Harassment & Progressive Discipline","version":"4.5","effective":"January 1, 2026","section":"3.2","heading":"3.2 Business Gifts & Hospitality","breadcrumb":"POL-ETH-001 Code of Workplace Conduct, Anti-Harassment & Progressive Discipline > 3. Conflicts of Interest, Outside Employment & Gifts > 3.2 Business Gifts & Hospitality","text":"Employees may not solicit gifts from vendors or clients. Unsolicited nominal gifts (such as branded swag or holiday gift baskets) valued under $100 USD may be accepted. Gifts exceeding $100 must be politely declined or reported to Legal Compliance for donation/raffle. Cash, gift cards, and loans from vendors are strictly prohibited regardless of value."},{"id":"POL-ETH-001-4-1","policy_id":"POL-ETH-001","policy_title":"Code of Workplace Conduct, Anti-Harassment & Progressive Discipline","version":"4.5","effective":"January 1, 2026","section":"4","heading":"4. Workplace Alcohol, Substance-Free Policy & Office Etiquette","breadcrumb":"POL-ETH-001 Code of Workplace Conduct, Anti-Harassment & Progressive Discipline > 4. Workplace Alcohol, Substance-Free Policy & Office Etiquette","text":"- Alcohol at Company Events: Moderate alcohol consumption is permitted only at sanctioned company celebrations (e.g., quarterly socials, offsite dinners) for attendees aged 21+. Non-alcoholic alternatives must always be prominently offered. Operating a vehicle while impaired or exhibiting intoxicated behavior is strictly prohibited.\n- Illegal Substances: Possession, sale, or working under the influence of illegal drugs or non-prescribed controlled substances on company premises or during working hours is prohibited.\n- Hub Quiet Zones & Meeting Room Etiquette: Hub offices feature designated 'Library Quiet Zones' where phone/video calls are prohibited. Conference rooms left unoccupied 10 minutes past the scheduled start time are automatically released in Google Calendar."},{"id":"POL-ETH-001-5-1","policy_id":"POL-ETH-001","policy_title":"Code of Workplace Conduct, Anti-Harassment & Progressive Discipline","version":"4.5","effective":"January 1, 2026","section":"5","heading":"5. Progressive Discipline & Performance Improvement","breadcrumb":"POL-ETH-001 Code of Workplace Conduct, Anti-Harassment & Progressive Discipline > 5. Progressive Discipline & Performance Improvement","text":"While employment at VantagePoint is at-will, the Company generally follows a structured progressive discipline framework for performance or minor policy infractions:\n\n| Step | Action | Documentation & Duration | Approval Required |\n|---|---|---|---|\n| Step 1 | Verbal Coaching / Counseling | Manager follow-up email summarizing expectations | Direct Manager |\n| Step 2 | Written Warning | Formal warning placed in Workday personnel file; 30-day review | Direct Manager + People Partner |\n| Step 3 | Performance Improvement Plan (PIP) or Final Written Warning | 30- to 60-day structured PIP with measurable milestones and weekly check-ins | Dept Head + HR Director |\n| Step 4 | Termination of Employment | Involuntary separation upon failure to meet PIP or severe misconduct | VP People Ops + Legal |\n\nImmediate Termination Offenses: Severe infractions—including violence or threats of violence, theft, intentional security breaches, expense fraud, unlawful harassment, or working from an OFAC-embargoed country—bypass progressive steps and result in immediate termination."},{"id":"POL-FIN-001-1-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"1","heading":"1. Core Principles & Submission Deadlines","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 1. Core Principles & Submission Deadlines","text":"VantagePoint reimburses employees for reasonable, necessary, and properly documented business expenses incurred while conducting company business. Employees are expected to spend company funds with the same prudence they exercise with personal funds.\n\n- Booking Platform: All flights, hotels, and rental cars must be booked through Navan (formerly TripActions) using your corporate virtual card or linked personal card.\n- 30-Day Submission Rule: Expense reports must be submitted in Expensify within 30 calendar days of the transaction date (or trip completion date). Expenses submitted more than 60 days after the transaction date require VP of Finance exception approval and may be treated as taxable income under IRS accountable plan rules.\n- Itemized Receipts: Itemized receipts showing vendor name, date, individual items purchased, tax, and proof of payment are mandatory for all expenses of $25.00 or more (and for ALL lodging, airfare, rental car, and alcohol charges regardless of amount). Credit card summary slips alone are insufficient."},{"id":"POL-FIN-001-2-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"2","heading":"2. Air Travel & Rail Guidelines","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 2. Air Travel & Rail Guidelines","text":"| Travel Category | Booking Lead Time | Permitted Cabin Class | Seat Selection & Upgrades |\n|---|---|---|---|\n| Domestic Flights (< 5 hours) | At least 14 days in advance | Main Cabin / Standard Economy | Standard aisle/window seat fees reimbursable; Extra Legroom allowed for employees >6'2\" |\n| Long-Haul Domestic / Transcontinental (>= 5 hrs) | At least 14 days in advance | Main Cabin or Economy Plus / Comfort+ | Preferred/Extra Legroom seat selection reimbursable up to $120 each way |\n| International Flights (>= 6 hours) | At least 21 days in advance | Premium Economy (Business Class for VPs+ or overnight flights >10 hrs with immediate morning client meeting) | Airport lounge day pass reimbursable up to $65 if layover > 3 hours |\n| Amtrak / High-Speed Rail | At least 7 days in advance | Business Class (Acela / Regional) | Preferred over short-haul flights under 250 miles (e.g., NYC–DC, NYC–Boston) |\n\nEmployees may retain personal frequent flyer miles and hotel loyalty points earned on business travel, provided loyalty preferences do not increase ticket cost by more than $50 over the lowest logical fare in Navan."},{"id":"POL-FIN-001-3.1-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"3.1","heading":"3.1 Hotel Nightly Rate Caps (Pre-Tax)","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 3. Lodging & Ground Transportation > 3.1 Hotel Nightly Rate Caps (Pre-Tax)","text":"Employees should select standard single-occupancy rooms at corporate-rate hotels in Navan within the following nightly pre-tax caps:\n\n- Tier A High-Cost Cities (New York City, San Francisco, London, Tokyo, Zurich): Up to $375 / night.\n- Tier B Major Hubs & Metros (Miami, Seattle, Austin, Boston, Chicago, Los Angeles, Washington D.C.): Up to $275 / night.\n- Tier C All Other Domestic & International Cities: Up to $210 / night.\n\nConference host hotels exceeding these caps by up to 20% are automatically approved if booked through the official conference room block. Incidentals such as in-room movies, minibar alcohol, spa services, and dry cleaning (for trips under 5 nights) are non-reimbursable."},{"id":"POL-FIN-001-3.2-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"3.2","heading":"3.2 Ground Transportation & Mileage","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 3. Lodging & Ground Transportation > 3.2 Ground Transportation & Mileage","text":"- Rideshare & Taxis: UberX, Lyft Standard, or licensed taxis are reimbursable for airport transfers and business transit. Uber Black/Lux is permitted only when traveling with 3+ colleagues or for safety reasons late at night (after 10:00 PM).\n- Rental Cars: Intermediate/Midsize class booked via Navan (National/Enterprise corporate code includes primary CDW/LDW insurance—decline rental counter collision waivers for domestic rentals). Fuel must be refilled prior to return.\n- Personal Vehicle Mileage: Reimbursed at the 2026 IRS standard mileage rate of $0.70 per mile for business travel exceeding the employee's normal daily commute."},{"id":"POL-FIN-001-4.1-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"4.1","heading":"4.1 Daily Travel Meal Caps (Individual Travel)","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 4. Meals, Per Diem & Client Entertainment > 4.1 Daily Travel Meal Caps (Individual Travel)","text":"VantagePoint reimburses actual meal expenses (including tax and up to 20% tip) up to the following daily maximums while traveling overnight on business:\n\n| Meal Period | Standard U.S. Cities | Tier A High-Cost Cities (NYC, SF, London, etc.) |\n|---|---|---|\n| Breakfast | Up to $20 | Up to $25 |\n| Lunch | Up to $25 | Up to $35 |\n| Dinner | Up to $45 | Up to $60 |\n| Daily Combined Cap | $90 / day | $120 / day |"},{"id":"POL-FIN-001-4.2-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"4.2","heading":"4.2 Client Meals & Team Dinners","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 4. Meals, Per Diem & Client Entertainment > 4.2 Client Meals & Team Dinners","text":"- Client Entertainment: Reimbursable up to $125 per person (inclusive of tax, tip, and moderate alcohol—max 2 drinks per attendee). Expensify entry must list the full names, titles, and company names of all external attendees plus the business purpose.\n- Internal Team Meals: Manager-approved team celebrations or offsite dinners are capped at $65 per employee (including tax and tip) and require prior department budget sign-off."},{"id":"POL-FIN-001-5.1-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"5.1","heading":"5.1 Corporate Brex / Amex Virtual Cards","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 5. Corporate Credit Cards, Non-Reimbursables & Audit > 5.1 Corporate Brex / Amex Virtual Cards","text":"Employees who travel 3 or more times per year or manage recurring SaaS/event budgets may request a corporate Brex card in Rippling. Personal charges on corporate cards are strictly prohibited; accidental personal swipes must be repaid within 10 business days via Expensify."},{"id":"POL-FIN-001-5.2-1","policy_id":"POL-FIN-001","policy_title":"Corporate Travel & Expense Reimbursement Policy","version":"6.1","effective":"March 1, 2026","section":"5.2","heading":"5.2 Non-Reimbursable Expenses & Audit Enforcement","breadcrumb":"POL-FIN-001 Corporate Travel & Expense Reimbursement Policy > 5. Corporate Credit Cards, Non-Reimbursables & Audit > 5.2 Non-Reimbursable Expenses & Audit Enforcement","text":"The following items are strictly non-reimbursable under all circumstances: parking tickets or traffic/speeding violations, airline club annual memberships, TSA PreCheck/Global Entry fees (covered separately via wellness perk), childcare/pet boarding during travel, political contributions, and personal gifts.\n\nFinance audits 100% of expenses over $500 and a random 15% sample of all other reports. Approved reimbursements are deposited via ACH within 5 business days of manager and Finance sign-off. Submitting falsified receipts or duplicate claims constitutes gross misconduct under POL-ETH-001 and may result in immediate termination."},{"id":"POL-HR-001-1-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"1","heading":"1. Purpose and Scope","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 1. Purpose and Scope","text":"VantagePoint Technologies Inc. ('VantagePoint' or the 'Company') is committed to providing a structured, transparent, and welcoming onboarding experience for every new team member. This policy defines employment classifications, pre-boarding compliance requirements, the 90-day onboarding roadmap, relocation assistance, and buddy mentorship standards across all U.S. hubs (Miami HQ, Austin, Seattle, New York) and Designated Remote locations.\n\nAll full-time, part-time, fixed-term, and intern employees must complete the onboarding milestones detailed herein. Independent contractors and agency workers are governed separately under POL-PROC-004 and receive modified security orientation under POL-SEC-001."},{"id":"POL-HR-001-2-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"2","heading":"2. Employment Classifications","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 2. Employment Classifications","text":"Each role at VantagePoint is assigned an official classification upon offer issuance. Classification determines eligibility for Paid Time Off (POL-HR-002), Health & Welfare Benefits (POL-BEN-001), Parental & Medical Leaves (POL-HR-004), and Equipment Stipends (POL-IT-001).\n\n| Classification | Scheduled Hours | FLSA Status | Benefits & PTO Eligibility |\n|---|---|---|---|\n| Regular Full-Time (Exempt) | 40+ hrs/week | Exempt (Salaried) | Full medical/dental/vision, 401(k) match, Tiered PTO, $1,000 WFH stipend |\n| Regular Full-Time (Non-Exempt) | 40 hrs/week | Non-Exempt (Hourly) | Full medical/dental/vision, 401(k) match, Tiered PTO, overtime eligible (>40 hrs/wk) |\n| Regular Part-Time | 20–29 hrs/week | Non-Exempt (Hourly) | Prorated PTO (50%), 401(k) eligibility after 6 months, EAP access; no medical plan |\n| Fixed-Term / Seasonal | Up to 40 hrs/week (<6 mos) | Non-Exempt or Exempt | Statutory sick leave only; Company-loaned laptop; ineligible for annual bonus |\n| Paid Intern / Co-op | 20–40 hrs/week (10–16 wks) | Non-Exempt (Hourly) | Accrues 1 hour sick leave per 30 hours worked; company-loaned laptop; commuter pass |"},{"id":"POL-HR-001-2.1-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"2.1","heading":"2.1 Introductory Evaluation Period","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 2. Employment Classifications > 2.1 Introductory Evaluation Period","text":"All newly hired regular employees complete a 90-calendar-day Introductory Period beginning on their official start date. During this period, managers conduct formal check-ins at Day 30, Day 60, and Day 90. Successful completion does not alter at-will employment status, nor does it delay access to accrued PTO (which may be used starting Day 1 upon manager approval)."},{"id":"POL-HR-001-3-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"3","heading":"3. Pre-Boarding & Day 1 Compliance Requirements","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 3. Pre-Boarding & Day 1 Compliance Requirements","text":"To prevent delays in payroll setup, benefits enrollment, and hardware delivery, candidates must complete all pre-boarding tasks in Workday at least five (5) business days prior to their start date.\n\n- Background Check & Offer Contingencies: Offers are contingent upon successful completion of criminal history, employment verification, and (for finance/security roles) credit screening via Checkr.\n- Form I-9 Employment Eligibility Verification: Section 1 must be completed on or before Day 1. Section 2 physical or authorized E-Verify remote document inspection must be completed no later than Day 3 (72 hours after start). Failure to complete Form I-9 by Day 3 results in mandatory unpaid administrative suspension until resolved.\n- Tax Withholding & Direct Deposit: Federal Form W-4, applicable state tax forms, and ACH bank routing details must be entered in Workday prior to the first payroll cutoff (the 10th and 25th of each month).\n- Mandatory Agreements: Signed Proprietary Information and Inventions Agreement (PIIA), Mutual Arbitration Agreement, and Code of Conduct Acknowledgment (POL-ETH-001).\n\nHardware Delivery SLA: IT Operations ships standard laptop kits 7 business days before the start date once background checks clear. If a start date is rescheduled within 5 business days of onboarding, hardware arrival may shift by 2–3 business days."},{"id":"POL-HR-001-4-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"4","heading":"4. Structured 30-60-90 Day Onboarding Roadmap","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 4. Structured 30-60-90 Day Onboarding Roadmap","text":"| Phase | Timeline | Key Milestones & Mandatory Trainings | Owner |\n|---|---|---|---|\n| Phase 1: Foundations | Week 1 (Days 1–5) | Live HR Welcome Orientation (Mon 10:00 AM EST), Okta/SSO & 1Password setup, Security Awareness 101 (POL-SEC-001), Meet Onboarding Buddy | People Ops & IT |\n| Phase 2: Immersion | Days 6–30 | Anti-Harassment & Workplace Conduct training (due Day 14), Benefits elections in Rippling (strict 30-day window), Role-specific shadowing, 30-Day Manager Alignment | Hiring Manager & Employee |\n| Phase 3: Contribution | Days 31–60 | First independent project deliverable, Cross-functional stakeholder introductions, 60-Day Feedback & Goal Calibration | Hiring Manager |\n| Phase 4: Integration | Days 61–90 | 90-Day Onboarding Survey, Final Introductory Review, Career Development Plan setup in Lattice | Employee & People Partner |"},{"id":"POL-HR-001-5.1-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"5.1","heading":"5.1 Onboarding Buddy Assignment","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 5. Onboarding Buddy Program & Relocation Support > 5.1 Onboarding Buddy Assignment","text":"Every new hire is paired with a trained peer Onboarding Buddy from an adjacent team (not in their direct reporting line) for their first 60 days. Buddies host at least two 30-minute coffee chats in Week 1 and weekly check-ins through Week 8 to help navigate internal tools (Slack, Confluence, Jira, Expensify) and company culture. Buddies receive a $75 lunch stipend via Expensify (code ONBOARD-BUDDY) to host an in-person or virtual meal."},{"id":"POL-HR-001-5.2-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"5.2","heading":"5.2 Relocation Assistance","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 5. Onboarding Buddy Program & Relocation Support > 5.2 Relocation Assistance","text":"Employees hired into approved hub-relocation roles (Miami HQ, Austin, or Seattle) are eligible for relocation packages tiered by career level, subject to a 12-month repayment clawback agreement if the employee voluntarily resigns within one year of relocation:\n\n- Tier 1 (Individual Contributors L1–L4): Up to $5,000 lump-sum relocation allowance (taxable) plus 14 days temporary corporate housing.\n- Tier 2 (Senior ICs L5–L6 & Managers): Up to $10,000 direct-billed household goods movement plus $2,500 settling-in allowance and 30 days corporate housing.\n- Tier 3 (Directors & VPs): Full white-glove relocation managed via Cartus Relocation Services, up to $25,000 cap."},{"id":"POL-HR-001-6-1","policy_id":"POL-HR-001","policy_title":"Employee Onboarding & Employment Classification Policy","version":"4.2","effective":"January 1, 2026","section":"6","heading":"6. Rehires & Internal Transfers","breadcrumb":"POL-HR-001 Employee Onboarding & Employment Classification Policy > 6. Rehires & Internal Transfers","text":"Former VantagePoint employees rehired within 12 months of voluntary separation in good standing retain their original tenure date for PTO accrual tiers (POL-HR-002) and 401(k) vesting (POL-BEN-001). Rehires after more than 12 months are treated as new hires for accrual and benefit waiting periods.\n\nInternal transfers between departments require a minimum of 12 months in the current role, a 'Meets Expectations' or higher rating in the most recent Lattice review cycle, and written notification to the current manager prior to final-round interviews."},{"id":"POL-HR-002-1-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"1","heading":"1. Overview and Philosophy","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 1. Overview and Philosophy","text":"VantagePoint believes sustainable high performance requires genuine rest and personal time away from work. We maintain a transparent, accrual-based Paid Time Off (PTO) program for vacation and personal time, paired with a separate dedicated Paid Sick & Safe Leave bank and 13 paid Company Holidays (11 fixed + 2 floating) per calendar year."},{"id":"POL-HR-002-2-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"2","heading":"2. Vacation & Personal PTO Accrual Tiers","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 2. Vacation & Personal PTO Accrual Tiers","text":"Regular full-time employees accrue PTO biweekly across 26 pay periods per year based on continuous length of service. Tenure tier increases take effect on the first day of the pay period following the employee's work anniversary.\n\n| Length of Service | Annual PTO Allowance | Biweekly Accrual Rate | Maximum Rollover Cap | Maximum Balance Ceiling |\n|---|---|---|---|---|\n| 0 – 2 Years (Months 1–24) | 15 days (120 hours) | 4.62 hours / pay period | 40 hours (5 days) | 160 hours (20 days) |\n| 2 – 5 Years (Months 25–60) | 20 days (160 hours) | 6.15 hours / pay period | 60 hours (7.5 days) | 220 hours (27.5 days) |\n| 5+ Years (Month 61+) | 25 days (200 hours) | 7.69 hours / pay period | 80 hours (10 days) | 280 hours (35 days) |"},{"id":"POL-HR-002-2.1-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"2.1","heading":"2.1 Carryover, Maximum Ceiling & Payout Rules","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 2. Vacation & Personal PTO Accrual Tiers > 2.1 Carryover, Maximum Ceiling & Payout Rules","text":"- Year-End Carryover: On December 31 at 11:59 PM EST, unused PTO above the Maximum Rollover Cap is forfeited (except in California, Colorado, Montana, and Nebraska, where state law prohibits forfeiture and accrued PTO rolls over subject to the Maximum Balance Ceiling).\n- Accrual Pause at Ceiling: Once an employee's PTO balance reaches the Maximum Balance Ceiling, biweekly accruals pause until PTO is used and the balance drops below the ceiling.\n- Negative PTO Borrowing: With written manager and People Partner approval, employees who have completed 90 days of service may borrow up to 40 hours (5 days) of unearned PTO. If employment ends while the balance is negative, the negative balance is deducted from the final paycheck where permitted by state law.\n- Payout Upon Separation: Accrued, unused vacation PTO is paid out in full upon voluntary resignation (with at least 2 weeks' notice) or involuntary termination without cause, calculated at the employee's base hourly rate."},{"id":"POL-HR-002-3-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"3","heading":"3. PTO Request & Approval Procedures","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 3. PTO Request & Approval Procedures","text":"All PTO requests must be submitted in Workday Time Off and approved by the direct manager before travel is booked or time is taken. During peak product launch blackouts or fiscal quarter-end close (for Finance/Accounting), managers may require staggered scheduling.\n\n| Duration of Absence | Minimum Advance Notice | Approval Required | Coverage Requirement |\n|---|---|---|---|\n| 1 – 2 consecutive days | At least 5 business days | Direct Manager | Update Slack status & OOO email |\n| 3 – 5 consecutive days | At least 2 weeks (10 business days) | Direct Manager | Written handoff doc + designated backup |\n| 6 – 10 consecutive days | At least 4 weeks (20 business days) | Direct Manager + Dept Head | Formal coverage plan shared 1 week prior |\n| More than 10 consecutive days | At least 6 weeks | Dept Head + VP People Ops | Executive exception approval required |"},{"id":"POL-HR-002-4-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"4","heading":"4. 2026 Official Company Holiday Schedule","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 4. 2026 Official Company Holiday Schedule","text":"VantagePoint observes 11 fixed U.S. Company Holidays (spanning 16 paid days including the Winter Recharge shutdown) plus 2 Floating Holidays. Non-exempt employees required to work on an observed holiday receive 1.5x holiday pay in addition to 8 hours of holiday pay.\n\n| Holiday Name | 2026 Observed Date | Day of Week | Notes |\n|---|---|---|---|\n| New Year's Day | January 1, 2026 | Thursday | All U.S. Offices Closed |\n| Martin Luther King Jr. Day | January 19, 2026 | Monday | All U.S. Offices Closed |\n| Presidents' Day | February 16, 2026 | Monday | All U.S. Offices Closed |\n| Memorial Day | May 25, 2026 | Monday | All U.S. Offices Closed |\n| Juneteenth National Independence Day | June 19, 2026 | Friday | All U.S. Offices Closed |\n| Independence Day (Observed) | July 3, 2026 | Friday | Observed Friday for Saturday July 4 |\n| Labor Day | September 7, 2026 | Monday | All U.S. Offices Closed |\n| Indigenous Peoples' / Veterans Day | November 11, 2026 | Wednesday | All U.S. Offices Closed |\n| Thanksgiving Day | November 26, 2026 | Thursday | All U.S. Offices Closed |\n| Day After Thanksgiving | November 27, 2026 | Friday | All U.S. Offices Closed |\n| Winter Break / Christmas Shutdown | December 24 – December 31, 2026 | Thursday – Thursday | Year-End Company Recharge (6 paid days) |"},{"id":"POL-HR-002-4.1-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"4.1","heading":"4.1 Floating Holidays","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 4. 2026 Official Company Holiday Schedule > 4.1 Floating Holidays","text":"Full-time employees hired before July 1 receive two (2) Floating Holidays (16 hours) per calendar year to observe cultural, religious, or personal milestones. Employees hired between July 1 and September 30 receive one (1) Floating Holiday; those hired on or after October 1 are eligible starting January 1 of the following year. Floating Holidays must be used by December 31 and do not carry over or pay out upon separation."},{"id":"POL-HR-002-5-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"5","heading":"5. Paid Sick & Safe Leave","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 5. Paid Sick & Safe Leave","text":"Separate from vacation PTO, all full-time employees receive 80 hours (10 days) of Paid Sick & Safe Leave front-loaded on January 1 each year (prorated by hire month for mid-year hires). Part-time employees accrue 1 hour of sick leave for every 30 hours worked."},{"id":"POL-HR-002-5.1-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"5.1","heading":"5.1 Qualifying Uses","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 5. Paid Sick & Safe Leave > 5.1 Qualifying Uses","text":"- Diagnosis, care, or treatment of an employee's own physical or mental illness, injury, or preventive medical/dental appointments.\n- Care for an ill family member (spouse, domestic partner, child, parent, sibling, grandparent, grandchild, or any individual related by blood or affinity whose close association is the equivalent of a family relationship).\n- Safe Leave: Absence due to domestic violence, sexual assault, or stalking (obtaining legal protection, relocation, victim services, or counseling).\n- Public health closure of the employee's workplace or a child's school/daycare."},{"id":"POL-HR-002-5.2-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"5.2","heading":"5.2 Notification & Documentation","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 5. Paid Sick & Safe Leave > 5.2 Notification & Documentation","text":"Employees must notify their manager via Slack or email at least 1 hour before their scheduled shift start when possible. A healthcare provider's note is required only for sick absences exceeding three (3) consecutive workdays. Unused Paid Sick & Safe Leave rolls over up to 80 hours per year (or higher where mandated by local ordinance such as Seattle, NYC, or California) and is never paid out upon termination."},{"id":"POL-HR-002-6-1","policy_id":"POL-HR-002","policy_title":"Paid Time Off (PTO), Company Holidays & Sick Leave Policy","version":"5.0","effective":"January 1, 2026","section":"6","heading":"6. Bereavement, Jury Duty & Voting Leave","breadcrumb":"POL-HR-002 Paid Time Off (PTO), Company Holidays & Sick Leave Policy > 6. Bereavement, Jury Duty & Voting Leave","text":"- Bereavement Leave: Up to 10 paid days following the loss of an immediate family member (spouse, partner, child, parent, sibling) and up to 5 paid days for extended family (grandparent, aunt, uncle, cousin, in-law). Pregnancy loss and failed adoption/IVF placements qualify for the 10-day immediate family tier.\n- Jury Duty & Witness Leave: Full regular base pay for up to 15 business days per calendar year when summoned for jury service or subpoenaed as a non-party witness. Employees must upload the court summons in Workday.\n- Election Voting Leave: Up to 4 hours of paid time off on Election Day if polling hours do not allow 3 consecutive off-duty hours to vote.\n- Volunteer Time Off (VTO): Full-time employees receive 16 hours (2 days) of paid Volunteer Time Off per calendar year to volunteer with a registered 501(c)(3) nonprofit organization, logged in Workday under 'Volunteer Leave'."},{"id":"POL-HR-003-1-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"1","heading":"1. Workplace Operating Model","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 1. Workplace Operating Model","text":"VantagePoint operates a 'Flexible-First' work model designed to balance deep focused work with intentional in-person collaboration. Every position is designated in Workday under one of three work-location profiles: Hub-Based Hybrid, Designated Remote, or In-Office Essential.\n\n| Work Profile | Eligibility Criteria | In-Office Expectation | Core Collaboration Hours |\n|---|---|---|---|\n| Hub-Based Hybrid | Residing within 35 miles of Miami HQ, Austin, or Seattle hubs | Minimum 2 days/week (Tuesdays & Thursdays anchor days) | 10:00 AM – 3:00 PM Hub Local Time |\n| Designated Remote | Residing >35 miles from a hub in an approved U.S. state | Quarterly team offsites (travel funded under POL-FIN-001) | 11:00 AM – 3:00 PM EST (Core Overlap) |\n| In-Office Essential | IT Hardware Ops, Facilities, Workplace Experience, Exec Support | 4–5 days/week on-site as scheduled | 8:30 AM – 5:00 PM Hub Local Time |"},{"id":"POL-HR-003-2-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"2","heading":"2. Remote Work Standards & Home Workspace Requirements","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 2. Remote Work Standards & Home Workspace Requirements","text":"Remote and hybrid employees are expected to maintain a safe, ergonomic, and distraction-free workspace capable of supporting uninterrupted video conferencing and secure data handling (see POL-SEC-001).\n\n- Internet Connectivity: Employees must maintain reliable high-speed broadband internet with minimum speeds of 50 Mbps download and 10 Mbps upload. Cellular hotspots are permitted only as emergency backups and never for handling Restricted/Confidential customer data.\n- Availability & Responsiveness: During Core Collaboration Hours (11:00 AM – 3:00 PM EST), remote employees must be reachable on Slack within 15 minutes and keep their Google Calendar up to date with working hours and focus blocks.\n- Dependent Care: Remote work is not a substitute for full-time childcare or eldercare. While occasional flexibility during school closures or appointments is supported, ongoing caregiving during working hours requires formal leave or flexible schedule arrangements."},{"id":"POL-HR-003-3-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"3","heading":"3. Domestic Relocation & State Tax Compliance","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 3. Domestic Relocation & State Tax Compliance","text":"Because payroll tax withholding, workers' compensation, and state employment laws depend on where work is physically performed, employees must request written approval from People Operations at least 30 days before changing their primary residential state.\n\nApproved U.S. Employment States: VantagePoint is currently registered to employ remote workers in 38 U.S. states. Working permanently from an unregistered state (including North Dakota, South Dakota, Wyoming, Alaska, Hawaii, and U.S. territories) is strictly prohibited without prior tax-entity setup."},{"id":"POL-HR-003-3.1-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"3.1","heading":"3.1 Compensation Geographic Tiers","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 3. Domestic Relocation & State Tax Compliance > 3.1 Compensation Geographic Tiers","text":"Base salaries at VantagePoint are benchmarked across three U.S. geographic compensation zones: Zone 1 (San Francisco Bay Area, NYC Metro, Seattle), Zone 2 (Miami, Austin, Boston, Denver, Chicago, Los Angeles, Washington D.C.), and Zone 3 (All other approved U.S. locations). Relocating from a higher-cost zone to a lower-cost zone triggers a base salary adjustment effective the first pay period following the move; relocating to a higher-cost zone requires prior VP-level budget approval."},{"id":"POL-HR-003-4-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"4","heading":"4. 'Work From Anywhere' (WFA) Temporary Travel Policy","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 4. 'Work From Anywhere' (WFA) Temporary Travel Policy","text":"Regular full-time employees in good performance standing (no active PIP) may work temporarily from an alternate domestic or approved international location for up to 30 cumulative calendar days per calendar year, subject to the rules below:"},{"id":"POL-HR-003-4.1-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"4.1","heading":"4.1 Domestic WFA (Within the United States)","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 4. 'Work From Anywhere' (WFA) Temporary Travel Policy > 4.1 Domestic WFA (Within the United States)","text":"- Up to 30 cumulative days per year in any U.S. state with manager notification at least 5 business days in advance.\n- Employees must work their normal core overlap hours regardless of local time zone."},{"id":"POL-HR-003-4.2-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"4.2","heading":"4.2 International WFA ('Workcations')","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 4. 'Work From Anywhere' (WFA) Temporary Travel Policy > 4.2 International WFA ('Workcations')","text":"- Maximum Cap: Up to 15 consecutive or cumulative calendar days per year (counted toward the 30-day total WFA allowance).\n- Pre-Approval Required: Must submit an International WFA Request in Workday at least 21 days prior to travel for Global Mobility, Tax, and InfoSec clearance.\n- Embargoed & High-Risk Countries: Working from OFAC-sanctioned countries or high-risk cybersecurity jurisdictions (including China, Russia, North Korea, Iran, Belarus, Cuba, Venezuela, and Syria) is strictly prohibited. Employees may not bring company laptops or access corporate systems from these jurisdictions even while on personal vacation.\n- Visa & Immigration Responsibility: Employees are solely responsible for ensuring their tourist/visitor visa permits remote work activities in the destination country."},{"id":"POL-HR-003-5-1","policy_id":"POL-HR-003","policy_title":"Remote, Hybrid & Temporary International Work Policy","version":"3.4","effective":"February 1, 2026","section":"5","heading":"5. Co-Working Space Day Passes","breadcrumb":"POL-HR-003 Remote, Hybrid & Temporary International Work Policy > 5. Co-Working Space Day Passes","text":"Designated Remote employees who do not live near a VantagePoint hub may expense up to $250/month for WeWork All Access or local co-working day passes via Expensify (category: WFH-COWORKING), provided the space offers private phone booths for confidential calls."},{"id":"POL-HR-004-1-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"1","heading":"1. Overview of Extended Leaves","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 1. Overview of Extended Leaves","text":"VantagePoint supports employees through major life milestones, serious health events, and long-term career renewal. All extended leaves exceeding five (5) consecutive business days are administered through our leave partner, Sparrow, in coordination with People Operations."},{"id":"POL-HR-004-2-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"2","heading":"2. Paid Parental Leave","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 2. Paid Parental Leave","text":"VantagePoint provides gender-neutral, 100% base-pay Paid Parental Leave to support new parents following the birth, adoption, or foster placement of a child. Company parental leave runs concurrently with federal FMLA, state CFRA/PFML, and Short-Term Disability (STD) benefits, with VantagePoint topping up state/STD wage replacement to equal 100% of regular base salary.\n\n| Parent Role / Category | Paid Leave Duration | Eligibility Requirement | Scheduling Flexibility |\n|---|---|---|---|\n| Birthing Parent | 16 weeks (6–8 wks STD medical recovery + 8–10 wks bonding) | Completed 6 months of continuous full-time service prior to due/placement date | May be taken continuously or split into up to 2 blocks within 12 months of birth |\n| Non-Birthing / Adoptive / Foster Parent | 12 weeks paid bonding leave | Completed 6 months of continuous full-time service prior to due/placement date | May be taken continuously or split into up to 2 blocks within 12 months of placement |\n| New Hires (< 6 Months Tenure) | 6 weeks paid bonding leave | Active full-time status on birth/placement date | Remaining balance (up to 12/16 wks) unlocks upon hitting 6-month anniversary if within 12 mos |"},{"id":"POL-HR-004-2.1-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"2.1","heading":"2.1 Gradual Return-to-Work Ramp & Lactation Support","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 2. Paid Parental Leave > 2.1 Gradual Return-to-Work Ramp & Lactation Support","text":"- 4-Week Phase-Back Schedule: Returning parents may work a 4-day (80%) schedule at 100% full-time pay during their first 4 weeks back from parental leave.\n- Lactation Accommodations: All VantagePoint hubs provide private, badge-restricted Wellness/Mother's Rooms equipped with hospital-grade sinks, refrigerators, and comfortable seating. Traveling nursing parents may expense Milk Stork breast milk shipping via Expensify (code: PARENTAL-TRAVEL)."},{"id":"POL-HR-004-3-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"3","heading":"3. Family & Medical Leave Act (FMLA) & Medical Leave","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 3. Family & Medical Leave Act (FMLA) & Medical Leave","text":"Under the federal Family and Medical Leave Act (FMLA), eligible employees who have worked for VantagePoint for at least 12 months and logged at least 1,250 hours in the preceding 12 months may take up to 12 weeks of job-protected leave in a rolling 12-month period for:\n\n- The birth, adoption, or foster care placement of a child (within 12 months of the event);\n- A serious health condition that makes the employee unable to perform the essential functions of their job;\n- Caring for a spouse, child, or parent with a serious health condition;\n- Qualifying exigencies arising out of a family member's covered active military duty (or up to 26 weeks to care for a covered servicemember with a serious injury or illness)."},{"id":"POL-HR-004-3.1-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"3.1","heading":"3.1 Pay & Benefits Continuation During Medical Leave","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 3. Family & Medical Leave Act (FMLA) & Medical Leave > 3.1 Pay & Benefits Continuation During Medical Leave","text":"For an employee's own serious health condition exceeding 7 consecutive calendar days, VantagePoint's company-paid Short-Term Disability (STD) plan provides 100% of base pay for Weeks 2–6 and 80% of base pay for Weeks 7–12 (accrued PTO or sick leave may be applied to cover the 7-day elimination period and the 20% gap in Weeks 7–12). Health, dental, and vision insurance remain active at standard employee contribution rates during all approved FMLA/STD leaves."},{"id":"POL-HR-004-4-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"4","heading":"4. Paid Tenure Sabbatical Program","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 4. Paid Tenure Sabbatical Program","text":"To recognize sustained loyalty and prevent burnout, VantagePoint grants a 4-week (20 business days) Paid Sabbatical to regular full-time employees upon completing every five (5) consecutive years of full-time service (Year 5, Year 10, Year 15, etc.).\n\n- Scheduling & Notice: Sabbaticals must be scheduled at least 90 days in advance with manager and Department Head approval and must be taken within 18 months of the milestone anniversary.\n- Combining with PTO: Employees may combine up to 5 days of accrued PTO with their 4-week sabbatical for a maximum consecutive absence of 5 weeks.\n- Forfeiture & Non-Payout: Sabbatical leave has no cash value, cannot be carried over beyond the 18-month window, and is not paid out upon termination or resignation."},{"id":"POL-HR-004-5-1","policy_id":"POL-HR-004","policy_title":"Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy","version":"3.1","effective":"January 1, 2026","section":"5","heading":"5. Personal Unpaid Leave of Absence & Military Leave","breadcrumb":"POL-HR-004 Parental Leave, Family & Medical Leave (FMLA) & Sabbatical Policy > 5. Personal Unpaid Leave of Absence & Military Leave","text":"- Personal Unpaid Leave: Employees with at least 1 year of tenure may request up to 30 calendar days of unpaid personal leave for compelling personal or educational reasons after exhausting accrued PTO, subject to VP People Ops approval.\n- Military Leave (USERRA): VantagePoint complies fully with USERRA and provides differential pay (the difference between military base pay and VantagePoint base pay) for up to 90 days per year for National Guard or Reserve training and active duty deployments."},{"id":"POL-IT-001-1-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"1","heading":"1. Standard Issue Computing Hardware","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 1. Standard Issue Computing Hardware","text":"VantagePoint provides every regular employee with company-owned, MDM-enrolled (Jamf Pro / Microsoft Intune) computing hardware tailored to their role. All company hardware remains the sole property of VantagePoint Technologies Inc.\n\n| Role Track | Primary Laptop Specification | Standard Peripherals Included | Refresh Cycle |\n|---|---|---|---|\n| General / Business / Ops | 14-inch Apple MacBook Pro (M4, 16GB RAM, 512GB SSD) OR Dell Latitude 7450 (32GB RAM) | USB-C Multiport Hub, YubiKey 5C NFC (x2), Laptop Sleeve | Every 36 months (3 years) |\n| Engineering / Data / Design | 16-inch Apple MacBook Pro (M4 Pro, 36GB RAM, 1TB SSD) | 27-inch 4K USB-C Monitor (shipped on request), YubiKey 5C NFC (x2) | Every 36 months (3 years) |\n| Executive / Frequent Travel | 13-inch MacBook Air (M4, 24GB RAM, 512GB SSD) + Cellular iPad Mini | Privacy Screen Filter, International Travel Adapter, YubiKey 5C NFC | Every 30 months |"},{"id":"POL-IT-001-2.1-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"2.1","heading":"2.1 One-Time Home Office Setup Allowance ($1,000)","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 2. Home Office Setup & Monthly Connectivity Stipends > 2.1 One-Time Home Office Setup Allowance ($1,000)","text":"All newly hired regular full-time employees receive a one-time reimbursement allowance of up to $1,000 USD (taxable as imputed income per IRS guidelines) during their first 90 days of employment to purchase ergonomic home office equipment.\n\n- Eligible Items: Ergonomic office chair, standing desk or desk converter, external monitor(s), mechanical keyboard, ergonomic mouse, webcam, ring light/desk lamp, noise-canceling headset, surge protector, and docking station.\n- Ineligible Items: Smartphones, tablets, smartwatches, televisions, gaming consoles, home decor/art, rugs, coffee machines, and monthly utility bills.\n- Reimbursement Process: Submit itemized receipts in Expensify under report tag 'NEW-HIRE-WFH' within 90 days of start date. Unused balances expire on Day 91. Items purchased with this stipend belong to the employee."},{"id":"POL-IT-001-2.2-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"2.2","heading":"2.2 Monthly Internet & Mobile Phone Stipend ($100/month)","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 2. Home Office Setup & Monthly Connectivity Stipends > 2.2 Monthly Internet & Mobile Phone Stipend ($100/month)","text":"Regular full-time employees receive a flat $100/month ($50 per biweekly paycheck) non-accountable communications allowance to offset home broadband and personal mobile data usage used for Slack, Okta Verify, and business calls. Because this allowance is paid automatically through payroll, employees may not separately expense monthly home internet or personal cell phone bills in Expensify (except international roaming packages pre-approved for business travel under POL-FIN-001)."},{"id":"POL-IT-001-3-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"3","heading":"3. Hardware Care, Loss, Theft & Accidental Damage","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 3. Hardware Care, Loss, Theft & Accidental Damage","text":"Employees must exercise reasonable care to protect company hardware from physical damage, liquid spills, extreme temperatures, and theft.\n\n- Accidental Damage: All company laptops carry AppleCare+ for Enterprise or Dell ProSupport Plus. First accidental damage incident is covered at no cost to the employee. Subsequent accidental damage incidents within a 12-month period may require manager review.\n- Lost or Stolen Devices: Must be reported to the IT Security Incident Hotline (+1-800-555-0199) and #it-helpdesk within 2 hours of discovery so IT can execute a remote lock/wipe. For stolen devices, employees must file a local police report within 24 hours and upload the case number to the IT ticket.\n- Unattended Devices: Never leave laptops visible inside parked vehicles, checked airline luggage, or unattended in public cafes/airports. Devices must always travel in carry-on baggage."},{"id":"POL-IT-001-4.1-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"4.1","heading":"4.1 Approved Software & SaaS","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 4. Software Procurement, BYOD & Offboarding Returns > 4.1 Approved Software & SaaS","text":"Employees may only install software from the VantagePoint Self-Service App Catalog (Jamf/Company Portal). Purchasing or signing up for unapproved cloud SaaS tools or AI transcription bots ('Shadow IT') using a corporate email address is prohibited unless reviewed by InfoSec and Procurement."},{"id":"POL-IT-001-4.2-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"4.2","heading":"4.2 Bring Your Own Device (BYOD)","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 4. Software Procurement, BYOD & Offboarding Returns > 4.2 Bring Your Own Device (BYOD)","text":"Accessing company Slack, Gmail, or Google Drive on a personal smartphone is permitted only if the device runs a supported OS version (iOS 18+ or Android 15+), has biometric/passcode lock enabled, and enrolls in Okta FastPass / Google Endpoint Verification. Local downloading of company files onto personal phones or personal computers is strictly prohibited."},{"id":"POL-IT-001-4.3-1","policy_id":"POL-IT-001","policy_title":"IT Equipment, Hardware Lifecycle & Home Office Stipend Policy","version":"4.0","effective":"January 15, 2026","section":"4.3","heading":"4.3 Offboarding & Equipment Return","breadcrumb":"POL-IT-001 IT Equipment, Hardware Lifecycle & Home Office Stipend Policy > 4. Software Procurement, BYOD & Offboarding Returns > 4.3 Offboarding & Equipment Return","text":"Upon resignation or termination, IT sends a prepaid FedEx/UPS return shipping kit with insured tracking to the employee's address on file. All company-owned laptops, monitors, YubiKeys, and badges must be dropped off with the carrier within seven (7) calendar days of the separation date. Failure to return company hardware may result in invoicing for depreciated replacement value and legal recovery."},{"id":"POL-SEC-001-1-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"1","heading":"1. Purpose & Security Governance","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 1. Purpose & Security Governance","text":"As an enterprise SaaS provider maintaining SOC 2 Type II, ISO 27001, and HIPAA compliance, VantagePoint entrusts every employee with safeguarding company intellectual property and customer data. Compliance with this policy is mandatory for all employees, contractors, interns, and third-party vendors."},{"id":"POL-SEC-001-2-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"2","heading":"2. Four-Tier Data Classification Standard","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 2. Four-Tier Data Classification Standard","text":"All documents, databases, Slack channels, and code repositories must be handled according to their sensitivity level:\n\n| Classification Level | Definition & Examples | Storage & Transmission Controls |\n|---|---|---|\n| Level 1: Public | Approved marketing collateral, public website content, press releases, job postings | No encryption required; may be shared externally without NDA |\n| Level 2: Internal | Org charts, internal policies, general Slack discussions, non-sensitive roadmaps | Must remain inside authenticated VantagePoint Workspace/Slack; no public posting |\n| Level 3: Confidential | Financial forecasts, M&A plans, source code, non-public pricing, employee salaries | Encrypted at rest (AES-256) and in transit (TLS 1.3); RBAC access; NDA required for external sharing |\n| Level 4: Restricted (PII/PHI/Secrets) | Customer production data, SSNs, bank details, API keys, passwords, encryption keys | Zero-trust hardware MFA required; prohibited in email attachments, Slack DMs, or local downloads |"},{"id":"POL-SEC-001-3-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"3","heading":"3. Access Control, Authentication & Password Hygiene","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 3. Access Control, Authentication & Password Hygiene","text":"- Single Sign-On & Hardware MFA: All corporate applications must be accessed through Okta SSO protected by phishing-resistant FIDO2/WebAuthn MFA (YubiKey 5C NFC or Okta FastPass biometric). SMS-based MFA is prohibited.\n- Enterprise Password Manager: Employees must use 1Password Enterprise for all non-SSO credentials. Passwords must be unique, randomly generated, and at least 16 characters long. Sharing passwords via Slack, email, or sticky notes is strictly forbidden.\n- Screen Lock & Clean Desk: Workstations must auto-lock after 5 minutes of inactivity. Employees working in hubs, cafes, or airplanes must lock their screen manually (Cmd+Ctrl+Q / Win+L) whenever stepping away and use privacy screen filters in public spaces.\n- Least Privilege Access: Access to production environments and Level 4 Restricted datasets requires formal JIT (Just-In-Time) elevation via ConductorOne with manager approval and automatically expires after 4 hours."},{"id":"POL-SEC-001-4-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"4","heading":"4. Generative AI & Third-Party Tools Usage","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 4. Generative AI & Third-Party Tools Usage","text":"VantagePoint encourages responsible productivity gains from approved AI tools while preventing data leakage and IP contamination:\n\n- Approved Enterprise AI Tools: Only VantagePoint's enterprise-licensed AI instances (Google Workspace Gemini Enterprise, Claude Enterprise, and GitHub Copilot Business—all governed by zero-data-retention BAAs) may be used for company work.\n- Prohibited Input into Consumer AI: Employees must NEVER paste Level 3 (Confidential) or Level 4 (Restricted) data, proprietary source code, customer names, or PII into public/free consumer AI accounts (e.g., personal ChatGPT, public Claude, free Gemini, or unapproved browser extensions).\n- Human Review: AI-generated code, legal language, or external customer communications must be reviewed and verified by a human employee before deployment or transmission."},{"id":"POL-SEC-001-5.1-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"5.1","heading":"5.1 Public Wi-Fi & VPN Requirements","breadcrumb":"POL-SEC-001 Information Security, Data Classification & Acceptable Use Policy > 5. Phishing, Removable Media & Network Security > 5.1 Public Wi-Fi & VPN Requirements","text":"When connecting from airports, hotels, cafes, or co-working spaces, employees must activate Cloudflare WARP Zero-Trust VPN prior to accessing internal resources. Connecting to unencrypted public Wi-Fi without VPN active is blocked by endpoint policy."},{"id":"POL-SEC-001-5.2-1","policy_id":"POL-SEC-001","policy_title":"Information Security, Data Classification & Acceptable Use Policy","version":"5.3","effective":"February 15, 2026","section":"5.2","heading":"5.2 USB & Removable Media","breadcrumb":"POL-SEC-001 Information Security, Data Class
